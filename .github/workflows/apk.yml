name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests
        run: ./gradlew :domain:test

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee build.log
        continue-on-error: true

      # Compile errors only reach the raw log, which needs a token to read.
      # Re-emitting them as a workflow annotation makes them public with the run.
      - name: Report compile errors
        if: steps.build.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re, os
          lines = open("build.log", errors="replace").read().splitlines()
          wanted = [
              l for l in lines
              if l.startswith("e: ")
              or ": error:" in l
              or l.startswith("FAILURE:")
              or l.startswith("* What went wrong")
              or "FAILED" in l
              or l.strip().startswith("> ") and "Task :" not in l
          ]
          root = os.getcwd() + "/"
          cleaned = [l.replace("file://" + root, "").replace(root, "") for l in wanted]
          if not cleaned:
              cleaned = lines[-60:]
          body = "\n".join(cleaned[:80])[:8000]
          print("::error title=Compile errors::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: zham-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
